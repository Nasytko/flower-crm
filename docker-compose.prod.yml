# Production Compose for NewERP on a single VPS (host Nginx terminates TLS).
#
# Expected host bindings (loopback ONLY):
#   127.0.0.1:3000 -> web
#   127.0.0.1:3001 -> api
# PostgreSQL: NO host port (internal Docker network only).
#
# Usage (from repo root, with production .env present):
#   docker compose -f docker-compose.prod.yml up -d postgres
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d api web
#
# NEVER run `docker compose -f docker-compose.prod.yml down -v` on production —
# that deletes the named PostgreSQL volume.

name: newerp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:17-alpine
    container_name: newerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - newerp_postgres_data:/var/lib/postgresql/data
    networks:
      - newerp_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging
    # Intentionally NO ports: section — Postgres must not be reachable from the host/Internet.

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      target: migrate
    container_name: newerp-migrate
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - newerp_internal
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      target: runner
    container_name: newerp-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      WEB_URL: ${WEB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1209600}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-erp_refresh}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-20}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-60}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-Europe/Minsk}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - newerp_internal
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: newerp-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - newerp_internal
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging
    stop_grace_period: 20s

volumes:
  newerp_postgres_data:
    name: newerp_postgres_data

networks:
  newerp_internal:
    name: newerp_internal
    driver: bridge
