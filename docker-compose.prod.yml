# Production Compose for erpbuket1 (HostFly VPS; host Nginx terminates TLS).
#
# Isolation: separate project/network/volume from shopbuket1 (or any other app).
#
# Host bindings (loopback ONLY — configurable):
#   127.0.0.1:${ERP_WEB_PORT:-3100} -> web  (container :3000)
#   127.0.0.1:${ERP_API_PORT:-3101} -> api  (container :3001)
# PostgreSQL: NO host port (Docker network only).
#
# Env file (secrets outside Git):
#   /etc/erpbuket1/production.env
#
# Example:
#   docker compose --env-file /etc/erpbuket1/production.env -f docker-compose.prod.yml up -d postgres
#   docker compose --env-file /etc/erpbuket1/production.env -f docker-compose.prod.yml run --rm migrate
#   docker compose --env-file /etc/erpbuket1/production.env -f docker-compose.prod.yml up -d api web
#
# NEVER run `docker compose ... down -v` on production — that deletes the PostgreSQL volume.
#
# Ops scripts (see docs/deployment.md):
#   ./deploy/scripts/install.sh | deploy.sh | status.sh | healthcheck.sh
#   ./deploy/scripts/backup.sh | restore-postgres.sh | rollback.sh
#   CONFIRM_NGINX_INSTALL=YES ./deploy/scripts/install-nginx.sh [--mode=http|https]
#   CONFIRM_CERTBOT=YES ./deploy/scripts/issue-cert.sh
# Nginx is NEVER modified by install/deploy alone.

name: erpbuket1

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging
    # Intentionally NO ports: section — Postgres must not be reachable from the host/Internet.

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      target: migrate
    restart: 'no'
    environment:
      NODE_ENV: production
      # Must be a complete URL (URL-encode special characters in the password).
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: '3001'
      DATABASE_URL: ${DATABASE_URL}
      WEB_URL: ${WEB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1209600}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-erp_refresh}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-20}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-60}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-Europe/Minsk}
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      YANDEX_SUGGEST_LL: ${YANDEX_SUGGEST_LL:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - '127.0.0.1:${ERP_API_PORT:-3101}:3001'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      target: runner
      args:
        # Baked into the Next.js client bundle at image build time (must be public HTTPS origin).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:${ERP_WEB_PORT:-3100}:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging
    stop_grace_period: 20s

volumes:
  postgres_data:
    name: erpbuket1_postgres_data
  uploads_data:
    name: erpbuket1_uploads_data

networks:
  internal:
    name: erpbuket1_internal
    driver: bridge
