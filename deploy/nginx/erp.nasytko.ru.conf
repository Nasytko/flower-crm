# Initial HTTP vhost for Certbot. Install on the VPS host (not in Docker):
#   sudo cp deploy/nginx/erp.nasytko.ru.conf /etc/nginx/sites-available/erp.nasytko.ru.conf
#   sudo ln -sf /etc/nginx/sites-available/erp.nasytko.ru.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then after DNS points here:
#   sudo certbot --nginx -d erp.nasytko.ru
#
# Routing (preserves /api/v1 — do NOT strip the /api prefix):
#   /        -> 127.0.0.1:3000 (Next.js)
#   /api/    -> 127.0.0.1:3001 (NestJS)

server {
    listen 80;
    listen [::]:80;
    server_name erp.nasytko.ru;

    client_max_body_size 1m;

    # NestJS API — path must remain /api/v1/...
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Refresh cookie Path=/api/v1/auth — keep Cookie / Set-Cookie intact.
        proxy_pass_header Set-Cookie;
    }

    # Next.js UI
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
