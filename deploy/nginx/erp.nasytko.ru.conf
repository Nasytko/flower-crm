# NewERP host Nginx reference/template (HTTP).
#
# Topology (unchanged):
#   Internet → host Nginx → 127.0.0.1:3000 (Next.js web)
#                          → 127.0.0.1:3001 (NestJS API)
#   PostgreSQL: Docker-internal only (not proxied here).
#
# Routing (do NOT strip /api — Nest serves /api/v1/...):
#   /api/           → newerp_api
#   /_next/static/  → newerp_web  (content-hashed; long-cache)
#   /               → newerp_web
#
# Production host may already have Certbot TLS/HSTS edits.
# Do NOT blindly overwrite /etc/nginx/sites-available/...
# Merge these performance directives into the live vhost, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Initial HTTP install (pre-Certbot) only:
#   sudo cp deploy/nginx/erp.nasytko.ru.conf /etc/nginx/sites-available/erp.nasytko.ru.conf
#   sudo ln -sf /etc/nginx/sites-available/erp.nasytko.ru.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d erp.nasytko.ru

upstream newerp_web {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream newerp_api {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.nasytko.ru;

    client_max_body_size 1m;

    # Built-in gzip only (no third-party Brotli module).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # NestJS API — path must remain /api/v1/...
    # No proxy_cache / no response caching (auth, orders, warehouse, etc.).
    location /api/ {
        proxy_pass http://newerp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Refresh cookie Path=/api/v1/auth — keep Cookie / Set-Cookie intact.
        proxy_pass_header Set-Cookie;
    }

    # Next.js content-hashed build assets (served by standalone container).
    # Still proxy_pass — do not read from host filesystem.
    location /_next/static/ {
        proxy_pass http://newerp_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js UI (HTML, /app, /login, other /_next/* — not immutable-cached).
    location / {
        proxy_pass http://newerp_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
