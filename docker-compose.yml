services:
  postgres:
    image: postgres:17-alpine
    container_name: flower-crm-postgres
    restart: unless-stopped
    ports:
      # Loopback only — never expose Postgres on a VPS via this compose file.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flower_crm}
    volumes:
      - flower_crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  flower_crm_postgres_data:
