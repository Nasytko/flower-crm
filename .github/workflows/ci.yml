name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flower_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flower_crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flower_crm?schema=public
      API_PORT: '3001'
      WEB_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-test-access-secret-minimum-32-characters
      JWT_ACCESS_TTL_SECONDS: '900'
      SESSION_TTL_SECONDS: '1209600'
      AUTH_COOKIE_NAME: erp_refresh
      AUTH_LOGIN_MAX_ATTEMPTS: '20'
      AUTH_LOGIN_WINDOW_SECONDS: '60'
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
